name: Arcadia
options:
  bundleIdPrefix: it.arcadia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  PLzmaSDK:
    # fissato a una revisione (tag 1.6.2): i pacchetti con unsafeFlags non si possono usare per versione
    url: https://github.com/OlehKulykov/PLzmaSDK
    revision: 4dbac7ac03ffd7f69ea5b03ec149683a351c37a9

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Arcadia:
    type: application
    platform: iOS
    sources:
      - path: Arcadia
    dependencies:
      - package: ZIPFoundation
      - package: PLzmaSDK
      - sdk: OpenGLES.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.arcadia.emulator
        PRODUCT_NAME: Arcadia
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Arcadia/Emulation/Arcadia-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GLES_SILENCE_DEPRECATION=1"]
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Arcadia/Info.plist
      properties:
        CFBundleDisplayName: Arcadia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  Arcadia:
    build:
      targets:
        Arcadia: all
    run:
      config: Debug
    archive:
      config: Release
